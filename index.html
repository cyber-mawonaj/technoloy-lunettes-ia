    <script>
      try {
        var raw = localStorage.getItem('technoloy_lunettes_pwa_v3');
        var parsed = raw ? JSON.parse(raw) : null;
        if (!parsed || parsed.theme !== 'light') {
          document.documentElement.classList.add('dark');

      } catch (e) {
        document.documentElement.classList.add('dark');
      }
